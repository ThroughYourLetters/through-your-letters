name: Bug report
description: Report incorrect behavior or a regression
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and who is affected?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the steps or a small example that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description:
        Include relevant errors, screenshots, or sanitized logs. Do not include tokens
        or personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description:
        Include app revision, deployment, browser/device, or service versions relevant
        to the problem.
    validations:
      required: false
