name: Containers

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          load: true
          tags: ttl-api:test
          cache-from: type=gha,scope=ttl-api
          cache-to: type=gha,mode=max,scope=ttl-api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ttl-web:test
          cache-from: type=gha,scope=ttl-web
          cache-to: type=gha,mode=max,scope=ttl-web
      - name: Check deployed containers
        run: node scripts/container-smoke.mjs
