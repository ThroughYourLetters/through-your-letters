name: Redis Command Budget

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: Fail after checking usage to test workflow notifications
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: redis-command-budget
  cancel-in-progress: false

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check provider command usage
        env:
          UPSTASH_EMAIL: ${{ secrets.UPSTASH_EMAIL }}
          UPSTASH_API_KEY: ${{ secrets.UPSTASH_API_KEY }}
          UPSTASH_DATABASE_ID: ${{ vars.UPSTASH_DATABASE_ID }}
        run: node scripts/check-redis-budget.mjs
      - name: Test failure notification
        if: ${{ inputs.test_notification }}
        run: |
          echo "::error::Intentional Redis budget notification test."
          exit 1
