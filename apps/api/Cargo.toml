[package]
name = "api"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
axum = { version = "0.8.8", features = ["multipart", "ws"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tower-http = { version = "0.6.8", features = ["cors", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "ipnetwork", "migrate", "macros", "json"] }
validator = { version = "0.20", features = ["derive"] }
config = "0.15"
dotenvy = "0.15"
thiserror = "2.0"
async-trait = "0.1.92"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic"] }
ndarray = "0.17"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
bytes = "1.11"
sha2 = "0.10"
bcrypt = "0.18"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
regex = "1.11"
percent-encoding = "2.3"
futures-util = "0.3"
aws-sdk-s3 = { version = "1.122", default-features = false, features = ["default-https-client", "rt-tokio"] }
redis = { version = "1.0", features = ["tokio-comp", "connection-manager", "tokio-native-tls-comp"] }
ts-rs = { version = "12.0", features = ["uuid-impl", "chrono-impl", "serde-compat"] }
http = "1.4.0"
[dev-dependencies]
tower = "0.5"
tokio-tungstenite = "0.28"
